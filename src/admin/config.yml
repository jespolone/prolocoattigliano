backend:
  name: github
  repo: jespolone/prolocoattigliano
  branch: main

media_folder: "media/eventi"
public_folder: "/media/eventi"

locale: it

collections:
  - name: eventi
    label: Eventi
    label_singular: Evento
    folder: src/eventi
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Titolo
        name: title
        widget: string
      - label: Data inizio
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - label: Data fine
        name: endDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - label: Orario
        name: time
        widget: string
        required: false
      - label: Luogo
        name: location
        widget: string
        required: false
      - label: Locandina
        name: cover
        widget: image
        required: false
      - label: Breve descrizione
        name: summary
        widget: text
      - label: Descrizione completa
        name: body
        widget: markdown
        required: false

  - name: impostazioni
    label: Informazioni sito
    files:
      - name: sito
        label: Dati e contatti
        file: src/_data/site.json
        format: json
        fields:
          - { label: Email, name: email, widget: string }
          - { label: Link Instagram, name: instagram, widget: string }
          - { label: Link Facebook, name: facebook, widget: string, required: false }
          - { label: Indirizzo, name: address, widget: string, required: false }
          - { label: Telefono, name: phone, widget: string, required: false }
          - { label: Presidente, name: president, widget: string, required: false }
          - { label: Codice fiscale, name: fiscalCode, widget: string, required: false }
          - { label: Orari di apertura, name: openingHours, widget: string, required: false }
          - { label: Anno di fondazione, name: foundedYear, widget: string, required: false }
